<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>投屏画面</title>
  <style>
    /* 观看页由本地 HTTP 中继直接吐出，不能引用相对路径资源：
       小狐狸几何在下面内联，与 assets/fox.svg 完全一致。 */
    :root { --indigo:#1e1b4b; --deep:#171340; --text:#f5f3ff; --soft:rgba(235,228,255,.64);
      --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.20);
      --beam:linear-gradient(100deg,#7c3aed 0%,#a855f7 26%,#ec4899 50%,#a855f7 74%,#7c3aed 100%); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden;
      font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; color:var(--text);
      background:radial-gradient(80% 80% at 8% -10%,rgba(124,58,237,.5),transparent 62%),
                 radial-gradient(70% 76% at 106% 112%,rgba(236,72,153,.38),transparent 62%),
                 linear-gradient(165deg,#1e1b4b 0%,#241f5c 56%,#1e1b4b 100%); }
    .frame { width:100%; height:100%; display:flex; flex-direction:column; }
    .bar { display:flex; align-items:center; gap:7px; height:30px; padding:0 12px;
      font-size:11px; background:var(--glass); border-bottom:1px solid var(--line);
      backdrop-filter:blur(14px); }
    .bar b { font-size:11px; letter-spacing:.4px; }
    .bar .state { margin-left:auto; font-size:10px; color:var(--soft); }
    .dot { width:7px; height:7px; border-radius:50%; background:#fda4af; box-shadow:0 0 8px rgba(236,72,153,.7); }
    .dot.live { background:var(--beam); background-size:200% 100%; box-shadow:0 0 0 3px rgba(168,85,247,.22),0 0 10px rgba(168,85,247,.7); }
    .screen { position:relative; flex:1; min-height:0; background:var(--deep); overflow:hidden; }
    #screen, #video { display:block; width:100%; height:100%; object-fit:contain; background:var(--deep); }
    #video { display:none; }
    .empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:6px; text-align:center;
      background:var(--glass); border:1px solid var(--line);
      backdrop-filter:blur(18px) saturate(135%); }
    .empty .fox { width:84px; height:84px; filter:drop-shadow(0 10px 20px rgba(124,58,237,.5)); }
    .empty b { font-size:12px; margin-top:2px; }
    .empty span { font-size:10px; color:var(--soft); max-width:80%; line-height:1.6; }
    .foot { height:24px; display:flex; align-items:center; padding:0 12px;
      font-size:9.5px; color:var(--soft); background:var(--glass); border-top:1px solid var(--line); }
    /* 纯净模式：连观看页自带的标题栏和页脚一起去掉，只剩等比适配的画面 */
    body.pure, body.pure .frame { background:var(--indigo); }
    body.pure .bar, body.pure .foot { display:none; }
    body.pure .screen, body.pure #screen, body.pure #video { background:var(--deep); }
    body.pure .empty { background:rgba(30,27,75,.72); color:var(--text); }
    body.pure .empty span { color:var(--soft); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; } }
  </style>
</head>
<body>

    <div class="bar"><span class="dot" id="dot"></span><b>iOS 投屏</b><span class="state" id="state">等待设备</span></div>

        <b id="emptyTitle">等待画面</b>
        <span id="emptyDesc">把 iOS 采集端的 JPEG 帧推到本地中继，画面会出现在这里。</span>
      </div>
    </div>
    <div class="foot"><span id="meta">仅本机回环 · 不对外联网</span></div>
  </div>

  <script>
    (function () {
      'use strict';
      var q = new URLSearchParams(location.search);
      var token = q.get('token') || '';
      var src = q.get('src') || '';
      var fit = ['contain', 'cover', 'fill'].indexOf(q.get('fit') || '') >= 0 ? q.get('fit') : 'contain';
      if (q.get('pure') === '1') document.body.classList.add('pure');
      var img = document.getElementById('screen');
      var video = document.getElementById('video');
      img.style.objectFit = fit;
      video.style.objectFit = fit;
      var empty = document.getElementById('empty');
      var dot = document.getElementById('dot');
      var state = document.getElementById('state');
      var meta = document.getElementById('meta');
      var hasFrame = false;

      function render() {
        empty.style.display = hasFrame ? 'none' : 'flex';
        dot.classList.toggle('live', hasFrame);
        state.textContent = hasFrame ? '画面已连接' : '等待设备';
      }

      // 把「真的解出像素了吗、多大」写进页面标题。
      // 这条 MJPEG 是多部分流，load 事件永远不结束，主进程无法用
      // executeJavaScript 注入（会一直等页面加载完而挂死）；标题是唯一
      // 不需要注入就能从外部读到的、来自渲染层的真实证据。
      function reportSize(w, h) {
        var W = Math.max(0, Math.round(w) || 0);
        var H = Math.max(0, Math.round(h) || 0);
        document.title = (W > 0 && H > 0) ? ('moyu-live ' + W + 'x' + H) : '投屏画面';
      }

      if (src && /\.(mp4|webm|ogv|mov)(\?|$)/i.test(src)) {
        img.style.display = 'none';
        video.style.display = 'block';
        video.src = src;
        video.onloadeddata = function () {
          hasFrame = true; render();
          reportSize(video.videoWidth, video.videoHeight);
        };
        video.onerror = function () { hasFrame = false; render(); };
        document.getElementById('emptyTitle').textContent = '等待视频流';
        meta.textContent = '外部视频源';
      } else {
        var stream = src || ('/mirror?token=' + encodeURIComponent(token));
        var sep = stream.indexOf('?') >= 0 ? '&' : '?';
        var retry = 0;
        var attach = function () {
          img.src = stream + sep + '_=' + Date.now();
        };
        // 流式连接可能因为中继重启、解码器首帧未就绪等原因断掉：
        // 断开后自行重连，用户不需要关掉再打开浮窗。
        img.onload = function () {
          hasFrame = true; retry = 0; render();
          reportSize(img.naturalWidth, img.naturalHeight);
        };
        img.onerror = function () {
          hasFrame = false;
          reportSize(0, 0);
          render();
          var delay = Math.min(4000, 400 * Math.pow(2, Math.min(retry++, 3)));
          setTimeout(attach, delay);
        };
        attach();
        if (src) {
          document.getElementById('emptyTitle').textContent = '等待外部画面';
          meta.textContent = '外部 MJPEG 源';
        }
      }

      // 状态来自本地中继；隐藏时主进程会暂停推帧，这里显示最近一帧时间
      setInterval(function () {
        fetch('/status?token=' + encodeURIComponent(token), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (!src) {
              // 帧数、推流状态这些是排查用的：这里只说「有没有画面」
              meta.textContent = s.frames
                ? (s.paused ? '画面已连接 · 已暂停' : '画面已连接')
                : '等待画面';
            }
          })
          .catch(function () {});
      }, 1800);

      // 尺寸自采样。多部分 MJPEG 的 load / error 事件在各内核状态下顺序并不固定
      // （有时只发 error、有时 load 时 naturalWidth 还是 0），只看事件会漏掉首帧。
      // 轮询 naturalWidth 最稳：既能驱动「画面已连接」状态，也保证标题里的
      // 取证信息一定反映真实解出的像素。
      setInterval(function () {
        var w = 0;
        var h = 0;
        if (video.style.display === 'block') { w = video.videoWidth || 0; h = video.videoHeight || 0; }
        else { w = img.naturalWidth || 0; h = img.naturalHeight || 0; }
        if (w > 0 && h > 0) {
          if (!hasFrame) { hasFrame = true; render(); }
          reportSize(w, h);
        }
      }, 250);

      render();
    })();
  </script>
